version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: gastromadrid-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - demo
      - app
      - api
    networks:
      - gastromadrid

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: gastromadrid-web
    environment:
      - VITE_API_URL=http://api:8080
      - VITE_ROOT_DOMAIN=${ROOT_DOMAIN:-gastromadrid.localhost}
    networks:
      - gastromadrid

  demo:
    build:
      context: ./apps/demo
      dockerfile: Dockerfile
    container_name: gastromadrid-demo
    environment:
      - VITE_API_URL=http://api:8080
      - VITE_ROOT_DOMAIN=${ROOT_DOMAIN:-gastromadrid.localhost}
    networks:
      - gastromadrid

  app:
    build:
      context: ./apps/app
      dockerfile: Dockerfile
    container_name: gastromadrid-app
    environment:
      - VITE_API_URL=http://api:8080
      - VITE_ROOT_DOMAIN=${ROOT_DOMAIN:-gastromadrid.localhost}
    networks:
      - gastromadrid

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: gastromadrid-api
    environment:
      - PORT=8080
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - ROOT_DOMAIN=${ROOT_DOMAIN:-gastromadrid.localhost}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gastromadrid

  mysql:
    image: mysql:8.0
    container_name: gastromadrid-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - gastromadrid

  analytics-runner:
    build:
      context: ./services/analytics-runner
      dockerfile: Dockerfile
    container_name: gastromadrid-analytics
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gastromadrid

  prometheus:
    image: prom/prometheus:latest
    container_name: gastromadrid-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gastromadrid

  grafana:
    image: grafana/grafana:latest
    container_name: gastromadrid-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - gastromadrid

networks:
  gastromadrid:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
